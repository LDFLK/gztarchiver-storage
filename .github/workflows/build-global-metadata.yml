name: Build Global Metadata

permissions:
  contents: write  

on:
  push:
    paths:
      - "doc-archive/**/*_metadata.json"  
  workflow_dispatch:                        

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Merge metadata
        run: |
          python3 - <<'EOF'
          import json
          import pandas as pd
          from pathlib import Path

          DOC_DIR = Path("doc-archive")
          OUT_FILE = Path("metadata/global_metadata.json")

          # Step 1: Read all *_metadata.json files from directory
          print("📂 Reading metadata files from directory...")
          new_records = []

          for metadata_file in sorted(DOC_DIR.rglob("*_metadata.json")):
              with open(metadata_file, "r") as f:
                  try:
                      data = json.load(f)
                      if "document_id" in data:
                          new_records.append(data)
                      else:
                          print(f"⚠️ Skipping file without document_id: {metadata_file}")
                  except json.JSONDecodeError:
                      print(f"⚠️ Skipping invalid JSON: {metadata_file}")
                      continue

          if not new_records:
              print("❌ No valid metadata files found")
              exit()

          # Create DataFrame from new records
          df_new = pd.DataFrame(new_records)
          print(f"📄 Found {len(df_new)} metadata files")

          # Step 2 & 3: Check if global_metadata.json exists
          if OUT_FILE.exists():
              print("📖 Loading existing global_metadata.json...")
              with open(OUT_FILE, "r") as f:
                  try:
                      existing_data = json.load(f)
                      df_existing = pd.DataFrame(existing_data) if existing_data else pd.DataFrame()
                  except json.JSONDecodeError:
                      print("⚠️ Invalid existing JSON, creating new file")
                      df_existing = pd.DataFrame()
          else:
              print("📝 global_metadata.json not found, will create new file")
              df_existing = pd.DataFrame()

          # Step 4: Merge logic - update, append, or skip
          added_count = 0
          updated_count = 0
          skipped_count = 0

          if df_existing.empty:
              # No existing data, use all new records
              df_final = df_new
              added_count = len(df_new)
          else:
              # Set document_id as index for easier comparison
              df_existing_indexed = df_existing.set_index("document_id")
              df_new_indexed = df_new.set_index("document_id")
              
              final_records = []
              
              # Process each existing record
              for doc_id, existing_row in df_existing_indexed.iterrows():
                  if doc_id in df_new_indexed.index:
                      # Found matching document_id
                      new_row = df_new_indexed.loc[doc_id]
                      
                      # Convert to dict for comparison
                      existing_dict = existing_row.to_dict()
                      new_dict = new_row.to_dict()
                      
                      if existing_dict != new_dict:
                          # Objects differ - replace with new
                          final_records.append(new_dict)
                          final_records[-1]["document_id"] = doc_id
                          updated_count += 1
                      else:
                          # Objects are identical - keep existing
                          final_records.append(existing_dict)
                          final_records[-1]["document_id"] = doc_id
                          skipped_count += 1
                  else:
                      # No match in new data - keep existing
                      existing_dict = existing_row.to_dict()
                      existing_dict["document_id"] = doc_id
                      final_records.append(existing_dict)
              
              # Add new records that don't exist in existing data
              for doc_id, new_row in df_new_indexed.iterrows():
                  if doc_id not in df_existing_indexed.index:
                      new_dict = new_row.to_dict()
                      new_dict["document_id"] = doc_id
                      final_records.append(new_dict)
                      added_count += 1
              
              df_final = pd.DataFrame(final_records)

          # Sort by document_date
          if "document_date" in df_final.columns:
              df_final["document_date"] = df_final["document_date"].fillna("0000-00-00")
              df_final = df_final.sort_values("document_date")

          # Ensure output folder exists
          OUT_FILE.parent.mkdir(parents=True, exist_ok=True)

          # Write final global metadata
          with open(OUT_FILE, "w") as f:
              json.dump(df_final.to_dict("records"), f, indent=2)

          print(f"\n✅ global_metadata.json updated successfully!")
          print(f"   📊 Total items: {len(df_final)}")
          print(f"   ➕ Added: {added_count}")
          print(f"   🔄 Updated: {updated_count}")
          print(f"   ⏭️  Skipped (unchanged): {skipped_count}")
          EOF

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add metadata/global_metadata.json
          git commit -m "Update global metadata" || echo "No changes to commit"
          git push
