name: Build Global Metadata

permissions:
  contents: write

on:
  push:
    paths:
      - "doc-archive/**/*_metadata.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Merge metadata
        run: |
          python3 - <<'EOF'
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          DOC_DIR = Path("doc-archive")
          OUT_DIR = Path("metadata")
          YEAR_FILE = re.compile(r"^\d{4}_metadata\.json$")

          # Rebuild from the source files on every run so entries can never be duplicated.
          # Keyed by document_id: one entry per document, grouped by the year folder it lives in.
          metadata_by_year = defaultdict(dict)

          # doc-archive/YYYY/MM/DD/<document_id>/<document_id>_metadata.json
          for metadata_file in sorted(DOC_DIR.rglob("*_metadata.json")):
              year = metadata_file.relative_to(DOC_DIR).parts[0]
              with open(metadata_file, "r") as f:
                  data = json.load(f)

              doc_id = data.get("document_id") or metadata_file.parent.name
              metadata_by_year[year][doc_id] = data

          OUT_DIR.mkdir(parents=True, exist_ok=True)

          # Sort by document_date, then document_id for a stable order
          def sort_key(obj):
              return (obj.get("document_date") or "0000-00-00", obj.get("document_id") or "")

          for year, docs in sorted(metadata_by_year.items()):
              year_list = sorted(docs.values(), key=sort_key)
              out_file = OUT_DIR / f"{year}_metadata.json"
              with open(out_file, "w") as f:
                  json.dump(year_list, f, indent=2)
              print(f"✅ {out_file.name} updated: {len(year_list)} items")

          # Remove year files whose year folder no longer exists in doc-archive
          for out_file in OUT_DIR.iterdir():
              if YEAR_FILE.match(out_file.name) and out_file.name[:4] not in metadata_by_year:
                  out_file.unlink()
                  print(f"Removed stale {out_file.name}")
          EOF

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A -- 'metadata/[0-9][0-9][0-9][0-9]_metadata.json'
          git commit -m "Update yearly metadata" || echo "No changes to commit"
          git push
