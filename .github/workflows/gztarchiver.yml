name: gztarchiver

on:
  schedule:
    - cron: "30 14 * * *" # Runs daily at 20:00 SGT, which is 14:30 UTC
  workflow_dispatch:      # Allows manual trigger

env:
  TZ: Asia/Colombo # Set Sri Lankan Time zone globally

jobs:
  run-archiver:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout storage repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TARGET_REPO_PAT }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          
      - name: Install archiver package
        run: pip install git+https://github.com/LDFLK/gztarchiver.git
        
      - name: Create config.yaml from secret
        run: |
          echo "${{ secrets.GZTARCHIVER_CONFIG }}" > config.yaml

      - name: Fetch new API token and update config
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
        run: |
          # Fetch new token using Basic Auth
          NEW_TOKEN=$(curl -k -s -X POST https://7060af6f-a5a9-44dd-b4e6-af36d56dbd47-prod.e1-us-east-azure.choreosts.dev/oauth2/token \
            -d "grant_type=client_credentials" \
            -H "Authorization: Basic $(echo -n $CONSUMER_KEY:$CONSUMER_SECRET | base64)" \
          | jq -r .access_token)

          echo "✅ New API token fetched"

          # Update config.yaml: replace divert_deepseek_api_key
          python - <<EOF
          import yaml

          # Load existing config
          with open("config.yaml", "r") as f:
              cfg = yaml.safe_load(f)

          # Replace the token
          cfg['credentials']['divert_deepseek_api_key'] = "$NEW_TOKEN"

          # Write updated config
          with open("config.yaml", "w") as f:
              yaml.safe_dump(cfg, f, default_flow_style=False)

          print("✅ Config updated with new API token")
          EOF
      
      - name: Archive four days of data
        env:
          TZ: Asia/Colombo
        run: |
          # Get dates for the last 3 days + today
          DATES=(
            $(date --date="3 days ago" +'%Y-%m-%d')
            $(date --date="2 days ago" +'%Y-%m-%d')
            $(date --date="1 day ago" +'%Y-%m-%d')
            $(date +'%Y-%m-%d')
          )
          
          for DATE in "${DATES[@]}"; do
            echo "🔄 Processing exact date: $DATE"
            YEAR=$(echo $DATE | cut -d'-' -f1)
            MONTH=$(echo $DATE | cut -d'-' -f2)
            DAY=$(echo $DATE | cut -d'-' -f3)
            
            gztarchiver --year $YEAR --month $MONTH --day $DAY --lang en --config config.yaml
            
            # Clean up metadata after each run to prevent issues
            rm -rf metadata
          done
          
      - name: Clean up
        run: |
          rm -rf ~/.cache/pip
          du -sh .
          
      - name: Commit and push changes
        env:
          TZ: Asia/Colombo
        run: |
          git config user.name "gzt-archiver-bot[bot]"
          git config user.email "gzt-archiver-bot[bot]@users.noreply.github.com"
          git add doc-archive
          
          COMMIT_MSG="🔄 Auto-update archive - $(date '+%Y-%m-%d') - $(date '+%H:%M:%S %Z')"
          
          git commit -m "$COMMIT_MSG" || echo "No changes to commit"
          git push origin main
          
      - name: Update README with status
        env:
          TZ: Asia/Colombo
        run: |
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S %Z')
          
          TOTAL_DOCS=$(find doc-archive -type f -name "*.pdf" | wc -l)
          TOTAL_UNAVAILABLE=$(find doc-archive -type f -name "unavailable.txt" | wc -l)
          
          if [ $TOTAL_DOCS -gt 0 ]; then
            ALL_DATES=$(find doc-archive -type f \( -name "*.pdf" -o -name "unavailable.txt" \) | \
              grep -oE '[0-9]{4}/[0-9]{2}/[0-9]{2}' | \
              sed 's|/|-|g' | \
              sort -u)
            
            if [ -n "$ALL_DATES" ]; then
              START_DATE=$(echo "$ALL_DATES" | head -1)
              END_DATE=$(echo "$ALL_DATES" | tail -1)
              DATE_RANGE="from $START_DATE to $END_DATE"
            else
              DATE_RANGE="date range unavailable"
            fi
          else
            DATE_RANGE=""
          fi
          
          SUMMARY_TABLE=$(
            find doc-archive -type f -name "*.pdf" | awk -F'/' '{print $2}' | sort | uniq -c > /tmp/archived_counts.txt
            find doc-archive -type f -name "unavailable.txt" | awk -F'/' '{print $2}' | sort | uniq -c > /tmp/unavailable_counts.txt
            
            awk '
            BEGIN { 
                while ((getline line < "/tmp/archived_counts.txt") > 0) {
                    split(line, a); archived[a[2]] = a[1]
                }
                while ((getline line < "/tmp/unavailable_counts.txt") > 0) {
                    split(line, u); unavailable[u[2]] = u[1]
                }
                close("/tmp/archived_counts.txt")
                close("/tmp/unavailable_counts.txt")
                
                for (year in archived) years[year] = 1
                for (year in unavailable) years[year] = 1
                
                n = asorti(years, sorted_years)
                for (i = 1; i <= n; i++) {
                    year = sorted_years[i]
                    arch_count = (year in archived) ? archived[year] : 0
                    unav_count = (year in unavailable) ? unavailable[year] : 0
                    printf "| %s | %s | %s |\n", year, arch_count, unav_count
                }
            }'
          )
          
          cat <<EOF > README.md
          # Sri Lanka 🇱🇰 - Gazette Dataset
          
          Last Updated: $TIMESTAMP
          
          **A daily archive of the Sri Lankan Government Gazette.**
          
          ---
          
          ## 📊 Archive Status Dashboard
          
          **Total Documents Archived:** $TOTAL_DOCS  
          **Unavailable Documents:** $TOTAL_UNAVAILABLE  
          **Archived Date Range:** $DATE_RANGE
          
          **Summary of Documents Archived:**
          
          | Year | Archived Docs | Unavailable Docs |
          |------|---------------|-----------------|
          $SUMMARY_TABLE
          
          ---
          
          **Processing Schedule:** Daily at 20:00, Sri Lankan Time.
          
          ---
          #OpenData #Govgazette #LankaDataFoundation
          EOF
          
          git config user.name "gzt-archiver-bot[bot]"
          git config user.email "gzt-archiver-bot[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "📊 Update status dashboard - $TIMESTAMP" || echo "No changes to commit"
          git push origin main
