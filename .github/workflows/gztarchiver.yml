name: gztarchiver

on:
  schedule:
    - cron: "30 14 * * *" # Runs daily at 20:00 SGT, which is 14:30 UTC
  workflow_dispatch:      # Allows manual trigger

env:
  TZ: Asia/Colombo # Set Sri Lankan Time zone globally

jobs:
  run-archiver:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout storage repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TARGET_REPO_PAT }}
          fetch-depth: 1
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          
      - name: Install dependencies
        run: |
          pip install git+https://github.com/LDFLK/gztarchiver.git
          pip install pandas pytz
        
      - name: Create config.yaml from secret
        run: |
          echo "${{ secrets.GZTARCHIVER_CONFIG }}" > config.yaml

      - name: Fetch new API token and update config
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
        run: |
          NEW_TOKEN=$(curl -k --http1.1 -s -X POST https://api.asgardeo.io/t/lankadatafoundation/oauth2/token \
            -H "Authorization: Basic $(printf "%s" "$CONSUMER_KEY:$CONSUMER_SECRET" | base64 -w0)" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&scope=default" \
          | jq -r .access_token)
          
          echo "✅ New API token fetched"
          echo "TOKEN: $NEW_TOKEN"

          # Update config.yaml: replace divert_deepseek_api_key
          python - <<EOF
          import yaml

          # Load existing config
          with open("config.yaml", "r") as f:
              cfg = yaml.safe_load(f)

          # Replace the token
          cfg['credentials']['divert_deepseek_api_key'] = "${NEW_TOKEN}"

          # Write updated config
          with open("config.yaml", "w") as f:
              yaml.safe_dump(cfg, f, default_flow_style=False)

          print("✅ Config updated with new API token")
          print("Updated")
          EOF
      
      - name: Archive four days of data
        env:
          TZ: Asia/Colombo
        run: |
          # Get dates for the last 3 days + today
          DATES=(
            $(date --date="3 days ago" +'%Y-%m-%d')
            $(date --date="2 days ago" +'%Y-%m-%d')
            $(date --date="1 day ago" +'%Y-%m-%d')
            $(date +'%Y-%m-%d')
          )
          
          for DATE in "${DATES[@]}"; do
            echo "🔄 Processing exact date: $DATE"
            YEAR=$(echo $DATE | cut -d'-' -f1)
            MONTH=$(echo $DATE | cut -d'-' -f2)
            DAY=$(echo $DATE | cut -d'-' -f3)
            
            gztarchiver --year $YEAR --month $MONTH --day $DAY --lang en --config config.yaml
            
            # Clean up metadata after each run to prevent issues
            if [ -d "meta_data" ]; then
              echo "🧹 Removing metadata folder"
              rm -rf meta_data
            else
              echo "ℹ️ No metadata directory found"
            fi
          done
          
      - name: Clean up
        run: |
          rm -rf ~/.cache/pip
          du -sh .
          
      - name: Commit and push changes
        env:
          TZ: Asia/Colombo
        run: |
          git config user.name "gzt-archiver-bot[bot]"
          git config user.email "gzt-archiver-bot[bot]@users.noreply.github.com"
          git add doc-archive
          
          COMMIT_MSG="🔄 Auto-update archive - $(date '+%Y-%m-%d') - $(date '+%H:%M:%S %Z')"
          
          git commit -m "$COMMIT_MSG" || echo "No changes to commit"
          git push origin main
      
      - name: Calculate statistics
        run: |
          python3 - <<'EOF'
          import json
          import pandas as pd
          from pathlib import Path
          from datetime import datetime
          import pytz

          def collect_metadata(base_path="doc-archive"):
              """Collect all metadata from JSON files into a list of dictionaries"""
              base = Path(base_path)
              metadata_files = list(base.rglob("*_metadata.json"))
              
              data = []
              for meta_file in metadata_files:
                  try:
                      with open(meta_file, 'r', encoding='utf-8') as f:
                          meta = json.load(f)
                          
                          # Extract year from file path (doc-archive/YYYY/MM/DD/...)
                          parts = meta_file.parts
                          year = parts[1] if len(parts) > 1 else None
                          
                          data.append({
                              'year': year,
                              'availability': meta.get('availability', 'Unknown'),
                              'file_path': str(meta_file),
                              'language': meta.get('language', 'Unknown')
                          })
                  except (json.JSONDecodeError, IOError) as e:
                      print(f"Error reading {meta_file}: {e}")
                      continue
              
              return pd.DataFrame(data)

          def count_pdf_files(base_path="doc-archive"):
              """Count total PDF files"""
              base = Path(base_path)
              pdf_files = list(base.rglob("*.pdf"))
              return len(pdf_files)

          def get_date_range(base_path="doc-archive"):
              """Get the date range from directory structure"""
              base = Path(base_path)
              
              # Find all date directories (YYYY/MM/DD pattern)
              date_dirs = []
              for path in base.rglob("*"):
                  parts = path.parts
                  if len(parts) >= 4:
                      try:
                          year, month, day = parts[1], parts[2], parts[3]
                          if year.isdigit() and month.isdigit() and day.isdigit():
                              date_str = f"{year}-{month}-{day}"
                              date_dirs.append(date_str)
                      except (IndexError, ValueError):
                          continue
              
              if date_dirs:
                  date_dirs = sorted(set(date_dirs))
                  return date_dirs[0], date_dirs[-1]
              return None, None

          def generate_statistics():
              """Generate all statistics needed for README"""
              print("Collecting metadata from JSON files...")
              df = pd.DataFrame()
              
              # Check if doc-archive exists
              if not Path("doc-archive").exists():
                  print("Warning: doc-archive directory not found")
                  return {
                      'total_docs': 0,
                      'total_unavailable': 0,
                      'date_range': '',
                      'year_summary': pd.DataFrame(columns=['Year', 'Archived', 'Unavailable'])
                  }
              
              df = collect_metadata()
              
              if df.empty:
                  print("No metadata files found")
                  total_docs = count_pdf_files()
                  return {
                      'total_docs': total_docs,
                      'total_unavailable': 0,
                      'date_range': '',
                      'year_summary': pd.DataFrame(columns=['Year', 'Archived', 'Unavailable'])
                  }
              
              print(f"Processed {len(df)} metadata files")
              
              # Count total PDFs
              total_docs = count_pdf_files()
              print(f"Total PDF files: {total_docs}")
              
              # Count unavailable documents
              total_unavailable = len(df[df['availability'] == 'Unavailable'])
              print(f"Total unavailable: {total_unavailable}")
              
              # Get date range
              start_date, end_date = get_date_range()
              date_range = f"from {start_date} to {end_date}" if start_date else ""
              
              # Year-wise summary
              # Count PDFs per year
              base = Path("doc-archive")
              pdf_files = list(base.rglob("*.pdf"))
              pdf_years = []
              for pdf in pdf_files:
                  parts = pdf.parts
                  if len(parts) > 1 and parts[1].isdigit():
                      pdf_years.append(parts[1])
              
              pdf_counts = pd.Series(pdf_years).value_counts().sort_index()
              
              # Count unavailable per year
              unavailable_counts = df[df['availability'] == 'Unavailable'].groupby('year').size()
              
              # Combine into summary table
              all_years = sorted(set(list(pdf_counts.index) + list(unavailable_counts.index)))
              
              year_summary = pd.DataFrame({
                  'Year': all_years,
                  'Archived': [pdf_counts.get(year, 0) for year in all_years],
                  'Unavailable': [unavailable_counts.get(year, 0) for year in all_years]
              })
              
              return {
                  'total_docs': total_docs,
                  'total_unavailable': total_unavailable,
                  'date_range': date_range,
                  'year_summary': year_summary,
                  'timestamp': datetime.now(pytz.timezone('Asia/Colombo')).strftime('%Y-%m-%d %H:%M:%S %Z')
              }

          def format_summary_table(year_summary):
              """Format the year summary as markdown table rows"""
              if year_summary.empty:
                  return "| No data available | 0 | 0 |"
              
              rows = []
              for _, row in year_summary.iterrows():
                  rows.append(f"| {row['Year']} | {int(row['Archived'])} | {int(row['Unavailable'])} |")
              return '\n'.join(rows)

          def main():
              print("=" * 60)
              print("Document Statistics Calculator")
              print("=" * 60)
              print()
              
              stats = generate_statistics()
              
              print()
              print("=" * 60)
              print("Summary:")
              print("=" * 60)
              print(f"Total Documents Archived: {stats['total_docs']}")
              print(f"Total Unavailable: {stats['total_unavailable']}")
              print(f"Date Range: {stats['date_range']}")
              print()
              print("Year-wise Summary:")
              print(stats['year_summary'].to_string(index=False))
              print()
              
              # Generate markdown table
              summary_table = format_summary_table(stats['year_summary'])
              
              # Output for use in GitHub Actions (can be captured)
              print("=" * 60)
              print("Markdown Table Output:")
              print("=" * 60)
              print(summary_table)
              
              # Save to file for GitHub Actions to read
              with open('/tmp/stats_output.txt', 'w') as f:
                  f.write(f"TOTAL_DOCS={stats['total_docs']}\n")
                  f.write(f"TOTAL_UNAVAILABLE={stats['total_unavailable']}\n")
                  f.write(f"DATE_RANGE={stats['date_range']}\n")
                  f.write(f"TIMESTAMP={stats['timestamp']}\n")
              
              with open('/tmp/summary_table.txt', 'w') as f:
                  f.write(summary_table)
              
              print()
              print("Output files created:")
              print("  - /tmp/stats_output.txt")
              print("  - /tmp/summary_table.txt")

          if __name__ == "__main__":
              main()
          EOF
          
      - name: Update README with status
        env:
          TZ: Asia/Colombo
        run: |
          # Read statistics from Python output
          source /tmp/stats_output.txt
          SUMMARY_TABLE=$(cat /tmp/summary_table.txt)
          
          cat <<EOF > README.md
          # Sri Lanka 🇱🇰 - Gazette Dataset
          
          Last Updated: $TIMESTAMP
          
          **A daily archive of the Sri Lankan Government Gazette.**
          
          ---
          
          ## 📊 Archive Status Dashboard
          
          **Total Documents Archived:** $TOTAL_DOCS  
          **Unavailable Documents:** $TOTAL_UNAVAILABLE  
          **Archived Date Range:** $DATE_RANGE
          
          **Summary of Documents Archived:**
          
          | Year | Archived Docs | Unavailable Docs |
          |------|---------------|-----------------|
          $SUMMARY_TABLE
          
          ---

          ## 📄 Document Usage Instructions

          ### View Document Online

          1. Get the `file_path` from the metadata object
          2. Use this URL pattern to view on GitHub:

          ```
          https://github.com/{github-user}/{github-repository}/blob/{github-branch}/{file_path}
          ```

          **Example:**
          ```
          https://github.com/LDFLK/gztarchiver-storage/blob/main/doc-archive/2026/01/05/2470-06/2470-06_english.pdf
          ```

          ### Download Document

          1. Get the `download_url` from the metadata object
          2. Use this URL pattern to download the raw file:

          #### Option 1
          ```
          https://raw.githubusercontent.com/{github-user}/{github-repository}/{github-branch}/{file_path}
          ```

          **Example:**
          ```
          https://raw.githubusercontent.com/ldflk/gztarchiver-storage/main/doc-archive/2026/01/05/2470-06/2470-06_english.pdf
          ```

          #### Option 2
          ```
          https://github.com/{github-user}/{github-repository}/blob/{github-branch}/{file_path}?raw=true
          ```

          **Example:**
          ```
          https://github.com/LDFLK/gztarchiver-storage/blob/main/doc-archive/2026/01/05/2470-06/2470-06_english.pdf?raw=true
          ```
          ---
          
          **Processing Schedule:** Daily at 20:00, Sri Lankan Time.
          
          ---
          #OpenData #Govgazette #LankaDataFoundation
          EOF
          
          git config user.name "gzt-archiver-bot[bot]"
          git config user.email "gzt-archiver-bot[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "📊 Update status dashboard - $TIMESTAMP" || echo "No changes to commit"
          git push origin main